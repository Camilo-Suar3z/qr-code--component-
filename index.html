<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 84%, 80%);
      }
    </style>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section>
      <div class="contenerdo-div">
        <article class="qr">
          <img src="./images/image-qr-code.png" alt=" qr" width="300" />
          <h2>Improve your front-end skills by building proyects</h2>
          <p>
            scan teh QR code to visit frontend mentor and take your coding skill
            to the next level
          </p>
        </article>
      </div>
    </section>

    <footer class="attribution"></footer>
  </body>
</html>
